services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    mem_limit: 612m
    cpus: "0.5"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: store_watches
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.3"
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "8080:8080"
    environment:
      ENV: development
      SERVER_PORT: "8080"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DATABASE_NAME: store_watches
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: "default"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "10"
      REDIS_MIN_IDLE_CONNS: "5"
      REDIS_MAX_RETRIES: "3"
      REDIS_DIAL_TIMEOUT: "5s"
      REDIS_READ_TIMEOUT: "3s"
      REDIS_WRITE_TIMEOUT: "3s"
      SECURITY_JWT_JWT_SECRET: ${SECURITY_JWT_JWT_SECRET}
      STATIC_DIR: /frontend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
